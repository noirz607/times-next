name: Update notices & deploy

on:
  schedule:
    # 避开整点高峰（GitHub 会在整点丢弃大量定时任务），并提高频率以弥补被跳过的运行
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    # 涓存椂 RSSHub 瀹炰緥锛宩ob 缁撴潫鍚庤嚜鍔ㄩ攢姣併€?    # ECNU 鐨勮矾鐢卞凡鍚堝苟杩涘畼鏂逛粨搴擄紝鎵€浠ョ洿鎺ヤ娇鐢ㄥ畼鏂归暅鍍忥紱
    # 濡傛灉闇€瑕佷娇鐢?ECNU-minus/RSSHub 涓皻鏈悎骞剁殑璺敱锛屽彲鏀逛负鑷鏋勫缓鐨勯暅鍍忋€?    services:
      rsshub:
        image: diygod/rsshub:latest
        ports:
          - 1200:1200
        options: >-
          --health-cmd "curl -f http://localhost:1200/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch notices from RSSHub
        env:
          RSSHUB_URL: http://localhost:1200
          # 鍦ㄤ粨搴?Settings 鈫?Variables 涓缃?SITE_URL锛堝 https://xxx.github.io/times-next锛夛紝
          # 鐢ㄤ簬璇诲彇涓婁竴娆￠儴缃茬殑鏁版嵁浠ョ疮绉巻鍙查€氱煡
          PREVIOUS_URL: ${{ vars.SITE_URL && format('{0}/notices.json', vars.SITE_URL) || '' }}
        run: npm run fetch

      - name: Build frontend
        env:
          VITE_SUBSCRIPTION_API_URL: ${{ vars.SUBSCRIPTION_API_URL || 'https://times-api.myecnu.org' }}
        run: npm run build

      - name: Send email notifications
        continue-on-error: true
        env:
          SUBSCRIPTION_API_URL: ${{ vars.SUBSCRIPTION_API_URL || 'https://times-api.myecnu.org' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://times.myecnu.org' }}
          RESEND_FROM: ${{ vars.RESEND_FROM || '鍗庡笀鏃ч椈缂撻€?<notify@myecnu.org>' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run notify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
